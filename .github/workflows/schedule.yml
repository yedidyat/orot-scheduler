name: Orot Scheduler

on:
  schedule:
    - cron: "0 4 * * 0-4"  # 07:00 Israel summer time (UTC+3), Sun-Thu
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Keepalive commit (prevents GitHub disabling the schedule)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          date -u >> keepalive.txt
          git add keepalive.txt
          git commit -m "keepalive: $(date -u +%%Y-%%m-%%d)"
          git push
